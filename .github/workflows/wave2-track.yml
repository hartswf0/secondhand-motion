name: Frames, SAM and depth (wave 2 and planned subjects)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wave2-track.yml'
      - 'data/track-now.json'
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      slugs: ${{ steps.s.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: data/track-now.json }
      - id: s
        run: echo "slugs=$(python3 -c "import json;print(json.dumps(json.load(open('data/track-now.json'))['slugs']))")" >> "$GITHUB_OUTPUT"
  track:
    needs: list
    if: needs.list.outputs.slugs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        slug: ${{ fromJSON(needs.list.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/wave2_track.py
            shots/${{ matrix.slug }}
      - name: Install CPU torch, transformers and ffmpeg
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          python3 -m venv /tmp/v && /tmp/v/bin/pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          /tmp/v/bin/pip install --quiet "transformers==4.57.1" pillow numpy accelerate
      - name: Frames, SAM 2.1 masks and depth
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.slug }}"
          set +e
          /tmp/v/bin/python -u tools/wave2_track.py --slug "${{ matrix.slug }}" --out "out/${{ matrix.slug }}" 2>&1 | tee "out/${{ matrix.slug }}/log.txt"
          exit ${PIPESTATUS[0]}
      - name: Commit the output to its own branch (artifact downloads are not reachable from the agent workspace)
        if: always()
        shell: bash
        run: |
          cd "out/${{ matrix.slug }}"
          git init -q -b "wave2-track/${{ matrix.slug }}"
          git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Wave 2 tracking output for ${{ matrix.slug }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/wave2-track/${{ matrix.slug }}"
